name: Sync Issue Tasks and Summary to PR

on:
  pull_request:
    types: [opened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Issue Data
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            let prBody = pr.body || '';

            // Find all closed issue numbers (e.g., Closes #12, Fixes #34)
            const issueRegex = /(?:closes|resolves|fixes)\s+#(\d+)/gi;
            const matches = [...prBody.matchAll(issueRegex)];
            if (matches.length === 0) {
              console.log('No linked issues found in PR description.');
              return;
            }

            const issueNumbers = [...new Set(matches.map(m => parseInt(m[1])))];
            let allTasks = [];
            let allSummaries = [];

            // Function to extract a section from Markdown body
            function extractSection(body, searchTerms) {
              const lines = body.split(/\r?\n/);
              let inSection = false;
              const sectionLines = [];
              
              for (const line of lines) {
                if (line.startsWith('## ')) {
                  const lowerLine = line.toLowerCase();
                  const matches = searchTerms.some(term => lowerLine.includes(term.toLowerCase()));
                  if (matches) {
                    inSection = true;
                    continue;
                  } else if (inSection) {
                    break;
                  }
                }
                if (inSection) {
                  sectionLines.push(line);
                }
              }
              
              let content = sectionLines.join('\n').trim();
              // Strip HTML comments to keep it clean
              content = content.replace(/<!--[\s\S]*?-->/g, '').trim();
              return content;
            }

            for (const issueNum of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNum,
                });

                if (!issue.body) continue;

                // Extract summary
                const summary = extractSection(issue.body, ['summary', '概要']);
                if (summary) {
                  allSummaries.push({ number: issueNum, content: summary });
                }

                // Extract checklist items (- [ ] or - [x])
                const taskRegex = /^\s*-\s*\[([ xX])\]\s+(.+)$/gm;
                const tasks = [...issue.body.matchAll(taskRegex)].map(t => {
                  const checked = t[1].toLowerCase() === 'x' ? 'x' : ' ';
                  return `- [${checked}] ${t[2]} (#${issueNum})`;
                });

                if (tasks.length > 0) {
                  allTasks.push(...tasks);
                }
              } catch (err) {
                console.error(`Failed to fetch issue #${issueNum}:`, err.message);
              }
            }

            let wasUpdated = false;

            // 1. Sync Summary if placeholders exist
            const sumStartTag = '<!-- SYNC_SUMMARY_START -->';
            const sumEndTag = '<!-- SYNC_SUMMARY_END -->';

            if (allSummaries.length > 0 && prBody.includes(sumStartTag) && prBody.includes(sumEndTag)) {
              let summaryMarkdown = '';
              if (allSummaries.length === 1) {
                summaryMarkdown = '\n' + allSummaries[0].content + '\n';
              } else {
                summaryMarkdown = '\n' + allSummaries.map(s => `### #${s.number} Summary\n${s.content}`).join('\n\n') + '\n';
              }

              const updatedBody = prBody.replace(
                new RegExp(`${sumStartTag}[\\s\\S]*?${sumEndTag}`),
                `${sumStartTag}${summaryMarkdown}${sumEndTag}`
              );

              if (updatedBody !== prBody) {
                prBody = updatedBody;
                wasUpdated = true;
                console.log('Summary prepared for sync.');
              }
            }

            // 2. Sync Tasks if placeholders exist
            const taskStartTag = '<!-- SYNC_TASKS_START -->';
            const taskEndTag = '<!-- SYNC_TASKS_END -->';

            if (allTasks.length > 0 && prBody.includes(taskStartTag) && prBody.includes(taskEndTag)) {
              const tasksMarkdown = '\n' + allTasks.join('\n') + '\n';
              const updatedBody = prBody.replace(
                new RegExp(`${taskStartTag}[\\s\\S]*?${taskEndTag}`),
                `${taskStartTag}${tasksMarkdown}${taskEndTag}`
              );

              if (updatedBody !== prBody) {
                prBody = updatedBody;
                wasUpdated = true;
                console.log('Tasks prepared for sync.');
              }
            }

            // Apply updates to the PR if changes were made
            if (wasUpdated) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: prBody,
              });
              console.log('PR description successfully synchronized.');
            }
