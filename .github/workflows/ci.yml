name: WEAVE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.15.2"

jobs:
  test:
    name: "Build + unit/stress tests + E2E"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build (host binaries + Wasm plugins)
        run: zig build

      - name: Verify artifacts
        run: |
          test -x zig-out/bin/WEAVE
          test -x zig-out/bin/weave-audit
          test -x zig-out/bin/weave-key
          test -x zig-out/bin/weave-obs-sim
          test -x zig-out/bin/weave-bridge
          test -x zig-out/bin/weave
          test -f wasm-apps/kusa_node.wasm
          test -f wasm-apps/bad_node.wasm
          test -f wasm-apps/scene_switcher.wasm

      - name: Unit, EventBus and stress tests
        run: zig build test_all

      # 最適化で挙動が変わる不具合 (例: SDK os_alloc の u32 折り返しで OOM テストが命令数上限に化けた) を拾う
      - name: Unit, EventBus and stress tests (ReleaseFast)
        run: zig build test_all -Doptimize=ReleaseFast

      - name: E2E — kusa pipeline (mock Twitch -> Wasm -> mock OBS)
        run: ./tests/e2e/kusa_pipeline.sh

      - name: E2E — OBS-compatible C plugins (built from source) in the sandbox
        run: ./tests/e2e/obs_compat_pipeline.sh

      - name: E2E — OBS restart re-applies desired state
        run: ./tests/e2e/obs_reconnect.sh

      - name: E2E — core kill -9 is back in < 1s with state restored
        run: ./tests/e2e/core_restart.sh

      - name: E2E — Streamer.bot bridge (existing tool joins as a remote node)
        run: ./tests/e2e/streamerbot_bridge.sh

      - name: E2E — howling (echo loop) is stopped by the hop limit
        run: ./tests/e2e/howling.sh

      - name: E2E — infinite loop is stopped by instruction metering, quarantined and recovered
        run: ./tests/e2e/infinite_loop.sh

      - name: E2E — Ctrl+C / SIGTERM exit cleanly every time (10 × 2 rounds)
        run: ./tests/e2e/shutdown.sh

      - name: E2E — record the events, replay the inputs, get the same OBS requests
        run: ./tests/e2e/record_replay.sh

      - name: E2E — OBS's bundled Countdown behavior as a WEAVE plugin (C3)
        run: ./tests/e2e/countdown.sh

      - name: E2E — what is down and why (core.health.summary), the read-only /status viewer, typo detection
        run: ./tests/e2e/health_status.sh

      - name: E2E — user approval of plugin permissions (weave add), re-approval when permissions grow
        run: ./tests/e2e/approval.sh

      - name: E2E — OBS refusing a source name is shown with the plugin and "did you mean", and clears once fixed
        run: ./tests/e2e/obs_names.sh

      - name: E2E — input-to-OBS latency is measured live (core.obs.latency) and shown on /status
        run: ./tests/e2e/latency.sh

      - name: E2E — an existing OBS tool wrapped by WEAVE (ObsGate): undeclared targets denied, floods paused
        run: ./tests/e2e/obs_gate.sh

      - name: E2E — egress cell as a separate process survives kill -9 (ADR-010 stage 1)
        run: ./tests/e2e/egress_isolation.sh

      - name: E2E — Wasm plugins in their own processes, checked by Core (ADR-010 stage 2)
        run: ./tests/e2e/plugin_isolation.sh

      - name: E2E — Core kill -9 with a plugin in its own process (state held by Core, restored from the snapshot)
        run: ISOLATE=1 ./tests/e2e/core_restart.sh

      - name: E2E — plugin processes are sandboxed (seccomp, network namespace, cgroup when delegated)
        run: ./tests/e2e/plugin_sandbox.sh

      - name: Setup Bun (AssemblyScript SDK)
        uses: oven-sh/setup-bun@v2

      - name: E2E — plugin written with the AssemblyScript SDK (weave init --lang as)
        run: ./tests/e2e/assemblyscript_sdk.sh

      - name: E2E — StreamElements Astro adapter (mock; JWT via env only)
        run: ./tests/e2e/streamelements.sh

      - name: E2E — Streamlabs Socket API adapter (mock; Engine.IO v3 ping, token via env only)
        run: ./tests/e2e/streamlabs.sh

      - name: Impact audit (security + failure radius)
        run: ./zig-out/bin/weave-audit
