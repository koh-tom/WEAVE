name: WEAVE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.15.2"

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: ビルド検証 + Wasm プラグインのアーティファクト化
  # ──────────────────────────────────────────────
  build:
    name: "🔨 Build (Host + Wasm)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build All (Host + Wasm plugins)
        run: zig build

      - name: Verify build artifacts
        run: |
          test -f zig-out/bin/WEAVE
          test -f wasm-apps/chat_node.wasm
          test -f wasm-apps/bad_node.wasm

      - name: Upload Wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-plugins
          path: wasm-apps/*.wasm
          retention-days: 1

  # ──────────────────────────────────────────────
  # Stage 2: テスト (build の完了後に実行)
  # ──────────────────────────────────────────────
  test:
    name: "🧪 All Tests (zig build test_all)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Download Wasm artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-plugins
          path: wasm-apps/

      - name: Run all tests
        run: zig build test_all

